<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART CART</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', monospace, sans-serif;
  background: #0a0e14;
  color: #e2eaf4;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 280px;
  grid-template-rows: 1fr 180px;
  gap: 1px;
  background-color: #1a2235;
}

/* 카메라 */
.cam {
  background: #0a0e14;
  position: relative;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

/* 영상: contain으로 실제 비율 유지 → zone CSS 1/3이 영상과 정확히 일치 */
.cam-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* 구역선 — .cam 전체가 아닌 영상 실제 영역에만 걸리게 JS로 위치 조정 */
.zone-overlay {
  position: absolute;
  pointer-events: none;
}
.zone-line {
  position: absolute;
  left: 0; right: 0;
  height: 1px;
  border-top: 1px dashed rgba(255,255,255,0.25);
}
.zone-line.ab { top: 33.333%; }
.zone-line.bc { top: 66.666%; }

.zone-tag {
  position: absolute;
  left: 10px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  padding: 2px 7px;
  border-radius: 2px;
}
.zone-tag.a { top: 8px;                background: rgba(167,139,250,0.2); color: #a78bfa; border: 1px solid rgba(167,139,250,0.3); }
.zone-tag.b { top: calc(33.333% + 8px); background: rgba(56,189,248,0.2);  color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); }
.zone-tag.c { top: calc(66.666% + 8px); background: rgba(52,211,153,0.2);  color: #34d399; border: 1px solid rgba(52,211,153,0.3); }

/* 감지 박스 캔버스 */
#overlayCanvas {
  position: absolute;
  pointer-events: none;
}

/* 우측 패널 */
.right {
  background: #0f1520;
  display: flex;
  flex-direction: column;
  border-left: 1px solid #1a2235;
}

.panel-title {
  padding: 10px 12px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #38bdf8;
  border-bottom: 1px solid #1a2235;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  scrollbar-width: thin;
  scrollbar-color: #1a2235 transparent;
}

.cart-empty {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: #243548;
}

.cart-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 8px;
  margin-bottom: 3px;
  background: #141c28;
  border: 1px solid #1a2235;
  border-radius: 3px;
  animation: slideIn 0.2s ease-out;
}
@keyframes slideIn { from { opacity:0; transform:translateX(8px); } to { opacity:1; transform:none; } }

.item-emoji { font-size: 18px; }
.item-name  { flex: 1; font-size: 12px; font-weight: 500; }
.item-qty   { font-size: 11px; font-weight: 700; color: #38bdf8; min-width: 20px; text-align: center; }
.item-price { font-size: 10px; color: #34d399; }
.item-del   { background: none; border: none; color: #243548; cursor: pointer; font-size: 13px; padding: 2px 4px; }
.item-del:hover { color: #f87171; }

/* 총금액 */
.total-box {
  padding: 10px 12px;
  border-top: 1px solid #1a2235;
}
.total-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.total-label  { font-size: 9px; letter-spacing: 0.15em; color: #5d7a96; }
.total-amount { font-size: 20px; font-weight: 700; color: #34d399; }
.total-won    { font-size: 11px; color: #5d7a96; }

.btn-pay {
  width: 100%;
  padding: 8px;
  border-radius: 3px;
  border: 1px solid #34d399;
  background: rgba(52,211,153,0.1);
  color: #34d399;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.15em;
  cursor: pointer;
  margin-bottom: 4px;
}
.btn-pay:hover { background: rgba(52,211,153,0.2); }

.btn-clear {
  width: 100%;
  padding: 5px;
  border-radius: 3px;
  border: 1px solid #1a2235;
  background: none;
  color: #5d7a96;
  font-size: 9px;
  letter-spacing: 0.12em;
  cursor: pointer;
}
.btn-clear:hover { border-color: #f87171; color: #f87171; }

/* 로그 */
.log-wrap {
  grid-column: 1 / 3;
  background: #0f1520;
  border-top: 1px solid #1a2235;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.log-head {
  padding: 6px 12px;
  border-bottom: 1px solid #1a2235;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.log-head-title { font-size: 9px; font-weight: 700; letter-spacing: 0.2em; color: #38bdf8; }
.ws-status      { font-size: 9px; letter-spacing: 0.1em; color: #243548; }
.ws-status.on   { color: #34d399; }

.log-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  scrollbar-width: thin;
  scrollbar-color: #1a2235 transparent;
}

.log-entry {
  display: flex;
  gap: 8px;
  padding: 2px 4px;
  border-radius: 2px;
  font-size: 10px;
  font-family: monospace;
  animation: fadeIn 0.15s ease-out;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.log-time { color: #243548; flex-shrink: 0; min-width: 56px; }
.log-tag  { font-weight: 700; flex-shrink: 0; min-width: 36px; }
.log-msg  { color: #5d7a96; }

.log-entry.add    { background: rgba(52,211,153,0.05); }
.log-entry.add    .log-tag { color: #34d399; }
.log-entry.remove .log-tag { color: #f87171; }
.log-entry.detect .log-tag { color: #38bdf8; }
.log-entry.detect { background: rgba(56,189,248,0.04); }
.log-entry.info   .log-tag { color: #243548; }
.log-entry.warn   .log-tag { color: #fb923c; }

/* 토스트 */
#toastArea {
  position: fixed;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.toast {
  padding: 6px 16px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  animation: toastAnim 2s forwards;
}
.toast.add    { background: rgba(52,211,153,0.15); border:1px solid #34d399; color:#34d399; }
.toast.remove { background: rgba(248,113,113,0.15); border:1px solid #f87171; color:#f87171; }
.toast.pay    { background: rgba(56,189,248,0.15);  border:1px solid #38bdf8; color:#38bdf8; }
@keyframes toastAnim {
  0%  { opacity:0; transform:translateY(-6px); }
  15% { opacity:1; transform:translateY(0); }
  75% { opacity:1; }
  100%{ opacity:0; }
}
</style>
</head>
<body>

<!-- 카메라 영역 -->
<div class="cam" id="camWrap">
  <img class="cam-video" src="/video_feed" alt="camera" id="camImg">

  <!-- zone 오버레이: JS로 영상 실제 렌더 영역에 딱 맞게 위치/크기 조정 -->
  <div class="zone-overlay" id="zoneOverlay">
    <div class="zone-line ab"></div>
    <div class="zone-line bc"></div>
    <div class="zone-tag a">ZONE A</div>
    <div class="zone-tag b">ZONE B</div>
    <div class="zone-tag c">ZONE C</div>
  </div>

  <!-- 감지 박스 캔버스 (중복 제거 — 하나만) -->
  <canvas id="overlayCanvas"></canvas>
</div>

<!-- 장바구니 + 총금액 -->
<div class="right">
  <div class="panel-title">
    // 장바구니
    <span id="cartBadge" style="color:#5d7a96;font-size:9px;">0개</span>
  </div>
  <div class="cart-list" id="cartList">
    <div class="cart-empty" id="cartEmpty">비어있음</div>
  </div>
  <div class="total-box">
    <div class="total-row">
      <span class="total-label">총 금액</span>
      <div>
        <span class="total-amount" id="totalAmount">0</span>
        <span class="total-won">원</span>
      </div>
    </div>
    <button class="btn-pay" id="btnPay">결제하기</button>
    <button class="btn-clear" id="btnClear">초기화</button>
  </div>
</div>

<!-- 로그 -->
<div class="log-wrap">
  <div class="log-head">
    <span class="log-head-title">// 감지 로그</span>
    <span class="ws-status" id="wsStatus">● WS OFFLINE</span>
  </div>
  <div class="log-list" id="logList"></div>
</div>

<div id="toastArea"></div>

<script>
const WS_URL = "ws://localhost:8000/ws";
let ws = null;
let cart = [];

/* ── 영상 실제 렌더 영역 계산 → zone/canvas 위치 동기화 ── */
function fitOverlay() {
  const wrap    = document.getElementById("camWrap");
  const img     = document.getElementById("camImg");
  const overlay = document.getElementById("zoneOverlay");
  const canvas  = document.getElementById("overlayCanvas");

  const ww = wrap.clientWidth;
  const wh = wrap.clientHeight;

  // object-fit: contain 이므로 실제 렌더 크기 계산
  const natW = img.naturalWidth  || 640;
  const natH = img.naturalHeight || 480;
  const scale = Math.min(ww / natW, wh / natH);
  const rw = natW * scale;
  const rh = natH * scale;
  const rx = (ww - rw) / 2;
  const ry = (wh - rh) / 2;

  [overlay, canvas].forEach(el => {
    el.style.left   = rx + "px";
    el.style.top    = ry + "px";
    el.style.width  = rw + "px";
    el.style.height = rh + "px";
  });
}

window.addEventListener("resize", fitOverlay);
document.getElementById("camImg").addEventListener("load", fitOverlay);
// naturalWidth가 0일 수 있어서 주기적으로도 체크
setInterval(fitOverlay, 500);

/* ── WebSocket 연결 ── */
function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    setWsStatus(true);
    addLog("서버 연결됨", "info");
  };

  ws.onclose = () => {
    setWsStatus(false);
    addLog("서버 연결 끊김 — 3초 후 재연결", "warn");
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    addLog("WebSocket 오류", "warn");
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };
}

function send(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(data));
  }
}

/* ── 메시지 처리 ── */
function handleMessage(msg) {
  switch (msg.type) {

    case "cart_init":
    case "cart_update":
      cart = msg.cart;
      renderCart(msg.total);
      break;

    case "item_added":
      cart = msg.cart;
      renderCart(msg.total);
      addLog(msg.log, "add");
      showToast("+ " + msg.product.emoji + " " + msg.product.name, "add");
      break;

    case "item_removed":
      cart = msg.cart;
      renderCart(msg.total);
      addLog(msg.log, "remove");
      showToast("− " + msg.product.emoji + " " + msg.product.name + " 제거", "remove");
      break;

    case "detections":
      drawDetections(msg.detections, msg.frame_w, msg.frame_h);
      break;

    case "checkout_done":
      cart = [];
      renderCart(0);
      addLog("결제 완료 — " + msg.total.toLocaleString() + "원", "warn");
      showToast("💳 결제완료 " + msg.total.toLocaleString() + "원", "pay");
      break;
  }
}

/* ── 감지 박스 그리기 ── */
const canvas = document.getElementById("overlayCanvas");
const ctx = canvas.getContext("2d");

function drawDetections(detections, fw, fh) {
  // canvas px 크기를 CSS 크기와 일치시킴
  canvas.width  = canvas.clientWidth;
  canvas.height = canvas.clientHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // fitOverlay가 이미 영상 비율로 맞춰뒀으므로 scaleX/Y는 canvas크기/원본크기
  const scaleX = canvas.width  / fw;
  const scaleY = canvas.height / fh;

  const zoneColors = { A: "#a78bfa", B: "#38bdf8", C: "#34d399" };

  for (const d of detections) {
    const [x1, y1, x2, y2] = d.bbox;
    const x = x1 * scaleX, y = y1 * scaleY;
    const w = (x2 - x1) * scaleX, h = (y2 - y1) * scaleY;
    const color = zoneColors[d.zone] || "#ffffff";

    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);

    const txt = d.label + " " + Math.round(d.conf * 100) + "% [" + d.zone + "]";
    ctx.font = "bold 12px monospace";
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle = "rgba(10,14,20,0.85)";
    ctx.fillRect(x, y - 20, tw + 8, 18);
    ctx.fillStyle = color;
    ctx.fillText(txt, x + 4, y - 5);
  }
}

/* ── 장바구니 렌더 ── */
function renderCart(total = 0) {
  const totalQty = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartBadge").textContent = totalQty + "개";
  document.getElementById("totalAmount").textContent = total.toLocaleString();
  document.getElementById("cartEmpty").style.display = cart.length === 0 ? "flex" : "none";

  document.querySelectorAll(".cart-item").forEach(el => {
    if (!cart.find(i => i.label === el.dataset.label)) el.remove();
  });

  const listEl = document.getElementById("cartList");

  for (const item of cart) {
    let el = listEl.querySelector('[data-label="' + item.label + '"]');
    if (!el) {
      el = document.createElement("div");
      el.className = "cart-item";
      el.dataset.label = item.label;
      el.innerHTML =
        '<span class="item-emoji">' + item.emoji + '</span>' +
        '<span class="item-name">'  + item.name  + '</span>' +
        '<span class="item-qty" data-qty>' + item.qty + '</span>' +
        '<span class="item-price">' + item.price.toLocaleString() + '원</span>' +
        '<button class="item-del" data-label="' + item.label + '">✕</button>';
      el.querySelector(".item-del").addEventListener("click", () => {
        send({ type: "remove_item", label: item.label });
        addLog('"' + item.name + '" 제거 요청', "remove");
      });
      listEl.insertBefore(el, listEl.firstChild);
    }
    el.querySelector("[data-qty]").textContent = item.qty;
  }
}

/* ── 결제 / 초기화 ── */
document.getElementById("btnPay").addEventListener("click", () => {
  if (cart.length === 0) return;
  send({ type: "checkout" });
});

document.getElementById("btnClear").addEventListener("click", () => {
  send({ type: "clear_cart" });
  addLog("장바구니 초기화", "warn");
});

/* ── 상태 표시 ── */
function setWsStatus(on) {
  const el = document.getElementById("wsStatus");
  el.textContent = on ? "● WS ONLINE" : "● WS OFFLINE";
  el.className = "ws-status" + (on ? " on" : "");
}

/* ── 로그 ── */
function addLog(msg, type = "info") {
  const tags = { add:"ADD", remove:"DEL", info:"SYS", warn:"WARN", detect:"DET" };
  const time = new Date().toLocaleTimeString("ko-KR", { hour12: false });
  const el = document.createElement("div");
  el.className = "log-entry " + type;
  el.innerHTML =
    '<span class="log-time">'  + time             + '</span>' +
    '<span class="log-tag">'   + (tags[type]||"SYS") + '</span>' +
    '<span class="log-msg">'   + msg              + '</span>';
  const list = document.getElementById("logList");
  list.insertBefore(el, list.firstChild);
  if (list.children.length > 40) list.lastChild.remove();
}

/* ── 토스트 ── */
function showToast(msg, type) {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  document.getElementById("toastArea").appendChild(el);
  setTimeout(() => el.remove(), 2100);
}

/* ── 시작 ── */
addLog("시스템 시작", "info");
connectWS();
fitOverlay();
</script>
</body>
</html>
